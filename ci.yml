name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code with black
      run: |
        pip install black
        black --check --diff .
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy bilingual_tokenizer.py --ignore-missing-imports
      continue-on-error: true
    
    - name: Test imports
      run: |
        python -c "from bilingual_tokenizer import BilingualTokenizerTrainer, BilingualConfig; print('✅ Imports successful')"

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Check documentation
      run: |
        echo "Checking required documentation files..."
        test -f README.md && echo "✅ README.md exists"
        test -f QUICKSTART.md && echo "✅ QUICKSTART.md exists"
        test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md exists"
        test -f LICENSE && echo "✅ LICENSE exists"
        test -f REFERENCES.md && echo "✅ REFERENCES.md exists"
        echo "📄 All documentation files present!"
